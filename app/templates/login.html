<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Industrial KPI Intelligence</title>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/json-enc.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
    }
    .login-card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .login-logo {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .login-title {
      font-size: 1.25rem;
      text-align: center;
      margin: 0 0 0.25rem;
      font-weight: 600;
    }
    .login-subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
      margin: 0 0 2rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 0.375rem;
      font-weight: 500;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.875rem;
      font-size: 0.95rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .login-submit {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .login-submit:hover { background: #2563eb; }
    .login-submit:disabled { background: #475569; cursor: wait; }
    .login-error {
      background: #7f1d1d;
      border-left: 3px solid #ef4444;
      color: #fecaca;
      padding: 0.625rem 0.875rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .login-error:empty { display: none; }
    .login-footer {
      text-align: center;
      color: #64748b;
      font-size: 0.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🏭</div>
    <h1 class="login-title">Industrial KPI Intelligence</h1>
    <p class="login-subtitle">Ingresá con tu cuenta para continuar</p>

    <div id="login-error" class="login-error"></div>

    <form
      id="login-form"
      hx-post="/auth/login"
      hx-ext="json-enc"
      hx-target="#login-error"
      hx-swap="innerHTML"
      hx-disabled-elt="#submit-btn"
    >
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@empresa.com"
          autocomplete="email"
          required
          autofocus
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Mínimo 8 caracteres"
          autocomplete="current-password"
          minlength="8"
          maxlength="128"
          required
        />
      </div>
      <button type="submit" id="submit-btn" class="login-submit">Ingresar</button>
    </form>

    <p class="login-footer">API REST · FastAPI + SQLModel + SQLite</p>
  </div>
</body>
</html>
